<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Santa Globe Flight Test</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#status {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 20;
    padding: 12px 16px;
    background: rgba(0,0,0,.82);
    color: white;
    border-radius: 8px;
    line-height: 1.5;
}

#controls {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 20;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 7px;
    background: #c62828;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #e53935;
}
</style>
</head>

<body>

<div id="status">
    🌎 Loading Earth...<br>
    🎅 Loading Santa...
</div>

<div id="controls">
    <button id="startButton">START SANTA</button>
</div>


<script type="importmap">
{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* =====================================================
   STATUS
===================================================== */

const status =
    document.getElementById("status");

const startButton =
    document.getElementById("startButton");


/* =====================================================
   SCENE
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.01,
        1000
    );

camera.position.set(
    0,
    2.5,
    6
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTS
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.5
    )
);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    5,
    8,
    5
);

scene.add(sun);


/* =====================================================
   ORBIT CONTROLS
===================================================== */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.minDistance = 2.5;

controls.maxDistance = 15;


/* =====================================================
   EARTH
===================================================== */

const EARTH_RADIUS = 2;

const textureLoader =
    new THREE.TextureLoader();

const earthTexture =
    textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
    );


const earthGeometry =
    new THREE.SphereGeometry(
        EARTH_RADIUS,
        96,
        96
    );


const earthMaterial =
    new THREE.MeshPhongMaterial({
        map: earthTexture,
        shininess: 8
    });


const earth =
    new THREE.Mesh(
        earthGeometry,
        earthMaterial
    );

scene.add(earth);


/* =====================================================
   ATMOSPHERE
===================================================== */

const atmosphereGeometry =
    new THREE.SphereGeometry(
        EARTH_RADIUS + 0.06,
        96,
        96
    );

const atmosphereMaterial =
    new THREE.MeshBasicMaterial({
        color: 0x55aaff,
        transparent: true,
        opacity: 0.12,
        side: THREE.BackSide
    });

const atmosphere =
    new THREE.Mesh(
        atmosphereGeometry,
        atmosphereMaterial
    );

scene.add(atmosphere);


/* =====================================================
   SANTA MODEL
===================================================== */

const loader =
    new GLTFLoader();

let santaModel = null;

let santaLoaded = false;


loader.load(

    "santa_-_norad_santa_tracker.glb",

    function(gltf) {

        console.log(
            "🎅 SANTA GLB LOADED!"
        );

        santaModel =
            gltf.scene;

        scene.add(
            santaModel
        );


        const box =
            new THREE.Box3()
                .setFromObject(
                    santaModel
                );


        const size =
            box.getSize(
                new THREE.Vector3()
            );


        const center =
            box.getCenter(
                new THREE.Vector3()
            );


        santaModel.position.sub(
            center
        );


        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        const scale =
            0.65 / largest;

        santaModel.scale.setScalar(
            scale
        );


        santaLoaded = true;


        status.innerHTML =
            "🌎 Earth ready<br>" +
            "🎅 Santa loaded<br>" +
            "🛷 Ready for flight";


    },

    function(progress) {

        if (progress.total) {

            const percent =
                Math.round(
                    progress.loaded /
                    progress.total *
                    100
                );

            status.innerHTML =
                "🌎 Loading Earth...<br>" +
                "🎅 Loading Santa... " +
                percent +
                "%";
        }

    },

    function(error) {

        console.error(
            "SANTA ERROR:",
            error
        );

        status.innerHTML =
            "❌ Santa failed to load.";
    }

);


/* =====================================================
   SANTA ROUTE
===================================================== */

const santaRoute = [

    {
        name: "International Date Line",
        lat: 66,
        lon: 180,
        zone: "UTC+12"
    },

    {
        name: "New Zealand",
        lat: -41,
        lon: 174,
        zone: "UTC+12"
    },

    {
        name: "Australia",
        lat: -33,
        lon: 151,
        zone: "UTC+11"
    },

    {
        name: "Japan",
        lat: 35.7,
        lon: 139.7,
        zone: "UTC+9"
    },

    {
        name: "South Korea",
        lat: 37.5,
        lon: 127,
        zone: "UTC+9"
    },

    {
        name: "China",
        lat: 39.9,
        lon: 116.4,
        zone: "UTC+8"
    },

    {
        name: "India",
        lat: 28.6,
        lon: 77.2,
        zone: "UTC+5:30"
    },

    {
        name: "Middle East",
        lat: 25.3,
        lon: 55.3,
        zone: "UTC+4"
    },

    {
        name: "Europe",
        lat: 51.5,
        lon: -0.1,
        zone: "UTC+0"
    },

    {
        name: "West Africa",
        lat: 6.5,
        lon: 3.4,
        zone: "UTC+1"
    },

    {
        name: "Brazil",
        lat: -23.5,
        lon: -46.6,
        zone: "UTC-3"
    },

    {
        name: "Caribbean",
        lat: 18.5,
        lon: -66.1,
        zone: "UTC-4"
    },

    {
        name: "Eastern United States",
        lat: 38.9,
        lon: -77,
        zone: "UTC-5"
    },

    {
        name: "Central United States",
        lat: 41.9,
        lon: -87.6,
        zone: "UTC-6"
    },

    {
        name: "Mountain United States",
        lat: 39.7,
        lon: -104.9,
        zone: "UTC-7"
    },

    {
        name: "Western United States",
        lat: 34,
        lon: -118.2,
        zone: "UTC-8"
    },

    {
        name: "Alaska",
        lat: 61.2,
        lon: -149.9,
        zone: "UTC-9"
    },

    {
        name: "North Pole",
        lat: 89,
        lon: 0,
        zone: "Polar"
    }

];


/* =====================================================
   LAT/LON → 3D POSITION
===================================================== */

function latLonToVector3(
    lat,
    lon,
    radius
) {

    const phi =
        (90 - lat) *
        Math.PI / 180;

    const theta =
        (lon + 180) *
        Math.PI / 180;


    return new THREE.Vector3(

        -radius *
        Math.sin(phi) *
        Math.cos(theta),

        radius *
        Math.cos(phi),

        radius *
        Math.sin(phi) *
        Math.sin(theta)

    );
}


/* =====================================================
   FLIGHT VARIABLES
===================================================== */

let flying = false;

let routeIndex = 0;

let segmentStart = 0;


/*
   30 seconds per route segment.
   This makes Santa much slower.
*/

const segmentDuration = 30000;


/*
   Santa stays clearly above Earth.
*/

const SANTA_ALTITUDE =
    EARTH_RADIUS + 0.55;


/* =====================================================
   UPDATE SANTA
===================================================== */

function updateSanta(time) {

    if (
        !santaLoaded ||
        !santaModel ||
        !flying
    ) {
        return;
    }


    const current =
        santaRoute[
            routeIndex
        ];


    const next =
        santaRoute[
            routeIndex + 1
        ];


    if (!next) {

        flying = false;

        startButton.textContent =
            "START SANTA";

        status.innerHTML =
            "🎅 Santa completed the route!";

        return;
    }


    if (!segmentStart) {

        segmentStart = time;
    }


    let progress =
        (time - segmentStart) /
        segmentDuration;


    if (progress >= 1) {

        routeIndex++;

        segmentStart = time;

        return;
    }


    /*
       Smooth movement.
    */

    const smooth =
        progress *
        progress *
        (3 - 2 * progress);


    /*
       Latitude
    */

    const lat =
        current.lat +
        (next.lat - current.lat) *
        smooth;


    /*
       Longitude
       with International Date Line handling.
    */

    let lonDifference =
        next.lon -
        current.lon;


    if (lonDifference > 180) {

        lonDifference -= 360;
    }


    if (lonDifference < -180) {

        lonDifference += 360;
    }


    let lon =
        current.lon +
        lonDifference *
        smooth;


    if (lon > 180) {

        lon -= 360;
    }


    if (lon < -180) {

        lon += 360;
    }


    /*
       Calculate Santa's position
       ABOVE Earth.
    */

    const position =
        latLonToVector3(
            lat,
            lon,
            SANTA_ALTITUDE
        );


    santaModel.position.copy(
        position
    );


    /*
       Look slightly ahead on route.
    */

    const aheadProgress =
        Math.min(
            smooth + 0.01,
            1
        );


    const aheadLat =
        current.lat +
        (next.lat - current.lat) *
        aheadProgress;


    let aheadLon =
        current.lon +
        lonDifference *
        aheadProgress;


    if (aheadLon > 180) {

        aheadLon -= 360;
    }


    if (aheadLon < -180) {

        aheadLon += 360;
    }


    const aheadPosition =
        latLonToVector3(
            aheadLat,
            aheadLon,
            SANTA_ALTITUDE
        );


    const direction =
        aheadPosition
            .sub(position)
            .normalize();


    const target =
        position.clone()
            .add(direction);


    santaModel.lookAt(
        target
    );


    /*
       Status display.
    */

    status.innerHTML =
        "🎅 SANTA IN FLIGHT<br>" +
        "📍 " + current.name + "<br>" +
        "🕐 " + current.zone + "<br>" +
        "✈️ Flying to " +
        next.name;

}


/* =====================================================
   START / STOP
===================================================== */

startButton.addEventListener(
    "click",
    function() {

        if (!santaLoaded) {

            return;
        }


        if (!flying) {

            flying = true;

            routeIndex = 0;

            segmentStart = 0;

            startButton.textContent =
                "STOP SANTA";

        } else {

            flying = false;

            startButton.textContent =
                "START SANTA";
        }

    }
);


/* =====================================================
   ANIMATION
===================================================== */

function animate(time) {

    requestAnimationFrame(
        animate
    );


    updateSanta(
        time
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


animate(0);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
